<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Snapcode</title>
<style>
  :root {
    --bg: #002C3E;      /* navy — page/header/editor background */
    --panel: #002C3E;   /* navy — header panel */
    --text: #F7F8F3;    /* off-white — primary text on dark surfaces */
    --accent: #F7444E;  /* coral — primary action (Run button) */
    --accent-2: #78BCC4;/* teal — secondary accents, borders, links */
    --output-bg: #F7F8F3; /* off-white — output panel background */
    --output-text: #002C3E; /* navy text on the light output panel */
    --border: rgba(247, 248, 243, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    font-size: 11px;
    color: var(--accent-2);
  }
  header .brand span:first-child { opacity: 1; }
  header .brand span:last-child { opacity: 0.65; }
  header .brand img { height: 16px; width: auto; display: block; }
  /* (img rule kept for the watermark logo below, unused in header now) */
  /* Subtle watermark inside the output panel — Monaco owns its own opaque
     canvas layer on the left, so a plain CSS background here (not fixed over
     the whole page) is the spot that actually stays visible and unobtrusive. */
  #output-panel {
    position: relative;
  }
  #output-panel::after {
    content: "";
    position: absolute;
    bottom: 16px;
    right: 18px;
    width: 160px;
    height: 42px;
    background: url("assets/logo.png") no-repeat center / contain;
    opacity: 0.07;
    pointer-events: none;
  }
  .controls { display: flex; align-items: center; gap: 10px; }
  select, button {
    background: rgba(247, 248, 243, 0.06);
    color: var(--text);
    border: 1px solid var(--accent-2);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.run {
    background: var(--accent);
    color: var(--text);
    border: none;
    font-weight: 600;
  }
  button.run:disabled { opacity: 0.5; cursor: default; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 420px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { margin: 0; font-size: 15px; color: var(--text); }
  .modal-header-actions { display: flex; align-items: center; gap: 10px; }
  .modal-clear-all {
    background: none;
    border: none;
    color: var(--text);
    font-size: 11px;
    opacity: 0.6;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .modal-clear-all:hover { opacity: 1; }
  .modal-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
  }
  .modal-close:hover { opacity: 1; }
  .modal-body { overflow-y: auto; padding: 8px; }
  .project-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    gap: 8px;
  }
  .project-row:hover { background: rgba(255, 255, 255, 0.06); }
  .project-row .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .project-row .meta { font-size: 11px; opacity: 0.6; }
  .project-row .delete-btn {
    background: none;
    border: none;
    color: var(--text);
    opacity: 0.45;
    cursor: pointer;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .project-row .delete-btn:hover { opacity: 1; background: rgba(244, 67, 54, 0.15); }
  .project-empty { padding: 20px; text-align: center; opacity: 0.6; color: var(--text); font-size: 13px; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editor { flex: 1; min-width: 160px; }
  #splitter {
    width: 6px;
    flex-shrink: 0;
    cursor: col-resize;
    background: var(--border);
    position: relative;
  }
  #splitter:hover, #splitter.dragging {
    background: var(--accent-2);
  }
  #splitter::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -3px; right: -3px;
  }
  #output-panel {
    width: 40%;
    flex-shrink: 0;
    min-width: 220px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--output-bg);
    color: var(--output-text);
    overflow-y: auto;
  }
  #output-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--output-text);
    opacity: 0.55;
    margin: 0;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0, 44, 62, 0.12);
  }
  #output {
    flex: 1;
    overflow: auto;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--output-text);
  }
  #stdinInput {
    margin: 0 14px 10px;
    background: rgba(0, 44, 62, 0.04);
    color: var(--output-text);
    border: 1px solid rgba(0, 44, 62, 0.2);
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 40px;
  }
  #runMeta {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--output-text);
    opacity: 0.6;
    border-top: 1px solid rgba(0, 44, 62, 0.12);
  }
  .stderr { color: #B3232B; } /* darker coral — readable on the light output panel */
  .note { color: var(--output-text); opacity: 0.55; font-size: 12px; margin-top: 10px; border-top: 1px solid rgba(0, 44, 62, 0.12); padding-top: 8px; }
  footer {
    text-align: center;
    padding: 10px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  footer .line1 { color: var(--accent-2); font-size: 11px; }
  footer .line2 { color: var(--accent-2); font-size: 11px; opacity: 0.65; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>Snapcode</h1>
  <div class="controls">
    <select id="language">
      <option value="python">Python</option>
      <option value="node">Node.js</option>
      <option value="dart">Dart</option>
      <option value="go">Go</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="typescript">TypeScript</option>
      <option value="web">Web (HTML/CSS/JS)</option>
    </select>
    <select id="examples">
      <option value="">Examples…</option>
    </select>
    <button class="run" id="runBtn">▶ Run</button>
    <button id="saveBtn">💾 Save</button>
    <button id="openBtn">📂 Open</button>
    <button id="newBtn">📄 New</button>
    <button id="importBtn">⬆ Import</button>
    <input type="file" id="importFile" accept=".py,.js,.dart,.go,.c,.cpp,.ts,.html,.txt" multiple style="display:none;">
  </div>
</header>

<div class="modal-overlay" id="projectsOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Open a saved project</h3>
      <div class="modal-header-actions">
        <button class="modal-clear-all" id="projectsClearAll">Clear all</button>
        <button class="modal-close" id="projectsClose">&times;</button>
      </div>
    </div>
    <div id="projectsList" class="modal-body">Loading…</div>
  </div>
</div>

<main>
  <div id="editor"></div>
  <div id="splitter" title="Drag to resize"></div>
  <div id="output-panel">
    <h2>Stdin (optional input)</h2>
    <textarea id="stdinInput" placeholder="Anything typed here is fed to the program's input()/readline() calls."></textarea>
    <h2>Output</h2>
    <div id="output">Run something to see output here.</div>
    <div id="runMeta"></div>
  </div>
</main>

<footer>
  <div class="line1">Built in Uganda</div>
  <div class="line2">Built by BrytMa Tech UG</div>
</footer>

<script src="https://unpkg.com/monaco-editor@0.48.0/min/vs/loader.js"></script>

      "Fireworks": `html_parts = []
html_parts.append("""<!DOCTYPE html>
<html><head><style>
  body { margin:0; background:#0a0a1a; overflow:hidden; }
  canvas { display:block; }
</style></head>

<canvas id="c"></canvas>

html_parts.append("<" + "script>")
html_parts.append("""
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = 380;
var particles = [];
function explode(x, y) {
  var hue = Math.floor(Math.random() * 360);
  var color = "hsl(" + hue + ",100%,60%)";
  for (var i = 0; i < 40; i++) {
    var angle = (Math.PI * 2 * i) / 40;
    var speed = 2 + Math.random() * 3;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60,
      color: color
    });
  }
}
function tick() {
  ctx.fillStyle = "rgba(10,10,26,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life -= 1;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  particles = particles.filter(function(p) { return p.life > 0; });
  if (Math.random() < 0.05) {
    explode(Math.random() * canvas.width, Math.random() * canvas.height * 0.6);
  }
  requestAnimationFrame(tick);
}
tick();
""")

      "Slithering snake": `html_parts = []
html_parts.append("<!DOCTYPE html><html><head><title>Snake</title>")
html_parts.append("<style>")
html_parts.append("body{margin:0;background:#0b1e13;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}")
html_parts.append("#board{position:relative;width:400px;height:400px;background:#102418;border:3px solid #78BCC4;}")
html_parts.append(".seg{position:absolute;width:18px;height:18px;background:#3ddc84;border-radius:4px;}")
html_parts.append(".food{position:absolute;width:16px;height:16px;background:#F7444E;border-radius:50%;}")
html_parts.append(".wrap{text-align:center;color:#F7F8F3;}")
html_parts.append("</style></head><body><div class='wrap'><h2>Slithering Snake</h2><div id='board'></div><p id='score'>Score: 0</p></div>")
html_parts.append("<" + "script>")
html_parts.append("""
const board = document.getElementById('board');
let snake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
let dir = {x:1,y:0};
let food = {x:12,y:8};
let score = 0;
const cell = 20;

function randomFood(){
  food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
}

function draw(){
  board.innerHTML = '';
  snake.forEach(s => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.left = (s.x*cell)+'px';
    d.style.top = (s.y*cell)+'px';
    board.appendChild(d);
  });
  const f = document.createElement('div');
  f.className = 'food';
  f.style.left = (food.x*cell+2)+'px';
  f.style.top = (food.y*cell+2)+'px';
  board.appendChild(f);
}

function step(){
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0) head.x = 19;
  if (head.x > 19) head.x = 0;
  if (head.y < 0) head.y = 19;
  if (head.y > 19) head.y = 0;
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y){
    score++;
    document.getElementById('score').textContent = 'Score: ' + score;
    randomFood();
  } else {
    snake.pop();
  }
  // simple AI: turn toward food occasionally
  if (Math.random() < 0.3){
    if (food.x > head.x) dir = {x:1,y:0};
    else if (food.x < head.x) dir = {x:-1,y:0};
    else if (food.y > head.y) dir = {x:0,y:1};
    else if (food.y < head.y) dir = {x:0,y:-1};
  }
  draw();
}
draw();
setInterval(step, 180);
""")
html_parts.append("<" + "/script>")
html_parts.append("</body></html>")
print("".join(html_parts))

html_parts.append("""
function makeDrop(){
  const d = document.createElement('div');
  d.className = 'drop';
  d.style.left = Math.random()*100 + 'vw';
  const duration = 0.6 + Math.random()*0.8;
  d.style.transition = 'top ' + duration + 's linear';
  document.body.appendChild(d);
  requestAnimationFrame(() => { d.style.top = '110vh'; });
  setTimeout(() => d.remove(), duration*1000 + 100);
}
setInterval(makeDrop, 40);

function lightning(){
  const flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = 0.8;
  setTimeout(() => {
    flash.style.transition = 'opacity 0.4s';
    flash.style.opacity = 0;
  }, 80);
  setTimeout(lightning, 3000 + Math.random()*4000);
}
setTimeout(lightning, 2000);
""")
html_parts.append("<" + "/script>")
html_parts.append("</body></html>")

  final double dt = period / steps;
  for (int i = 0; i <= steps; i++) {
    final double t = dt * i;
    final double angle = startAngleRad * cos(sqrt(g / length) * t);
    final double angleDeg = angle * 180 / pi;
    final String bar = _buildBar(angleDeg);
    print('t=\${t.toStringAsFixed(2)}s  angle=\${angleDeg.toStringAsFixed(1).padLeft(6)} deg  $bar');
  }

  print('---');
  print('Simulation complete: pendulum settles back toward equilibrium over time with damping.');
}

String _buildBar(double angleDeg) {
  final int pos = (angleDeg).round() + 30;
  final int clamped = max(0, min(60, pos));
  final StringBuffer sb = StringBuffer();
  for (int i = 0; i < 61; i++) {
    sb.write(i == clamped ? 'O' : (i == 30 ? '|' : '-'));
  }

}

      "Bubble sort": `void bubbleSort(List<int> list) {
  final int n = list.length;
  for (int i = 0; i < n - 1; i++) {
    bool swapped = false;
    for (int j = 0; j < n - i - 1; j++) {
      if (list[j] > list[j + 1]) {
        final int temp = list[j];
        list[j] = list[j + 1];
        list[j + 1] = temp;
        swapped = true;
      }
    }
    if (!swapped) break;
  }
}

void main() {

  bubbleSort(numbers);
  print('After:  \$numbers');

      "Elevator state machine": `package main

import "fmt"

type State int

const (
	Idle State = iota
	MovingUp
	MovingDown
	DoorsOpen
)

func (s State) String() string {
	switch s {
	case Idle:
		return "IDLE"
	case MovingUp:
		return "MOVING UP"
	case MovingDown:
		return "MOVING DOWN"
	case DoorsOpen:
		return "DOORS OPEN"
	}
	return "UNKNOWN"
}

type Elevator struct {
	floor int
	state State
}

func (e *Elevator) requestFloor(target int) {
	fmt.Printf("Request received: go to floor %d (currently on %d)\\n", target, e.floor)
	if target == e.floor {
		e.state = DoorsOpen
		fmt.Printf("  -> already here. State: %s\\n", e.state)
		return
	}
	if target > e.floor {
		e.state = MovingUp
	} else {
		e.state = MovingDown
	}
	for e.floor != target {
		if e.state == MovingUp {
			e.floor++
		} else {
			e.floor--
		}
		fmt.Printf("  -> passing floor %d (%s)\\n", e.floor, e.state)
	}
	e.state = DoorsOpen
	fmt.Printf("  -> arrived at floor %d. State: %s\\n", e.floor, e.state)
	e.state = Idle
}

func main() {
	e := &Elevator{floor: 0, state: Idle}
	fmt.Println("Elevator system online. Starting at ground floor.")
	e.requestFloor(5)
	e.requestFloor(1)
	e.requestFloor(1)
	fmt.Println("Elevator idle. Ready for next request.")
}

std::vector<int> sieveOfEratosthenes(int limit) {
    std::vector<bool> isPrime(limit + 1, true);
    isPrime[0] = isPrime[1] = false;
    for (int i = 2; (long long)i * i <= limit; i++) {
        if (isPrime[i]) {
            for (int j = i * i; j <= limit; j += i) {
                isPrime[j] = false;
            }
        }
    }
    std::vector<int> primes;
    for (int i = 0; i <= limit; i++) {
        if (isPrime[i]) primes.push_back(i);
    }
    return primes;

  <h2>Color Palette Generator</h2>

  <script>
    function randomHex() {
      return '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
    }
    function contrastColor(hex) {
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? '#000' : '#fff';
    }
    function generate() {
      const container = document.getElementById('swatches');
      container.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const hex = randomHex();
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = hex;
        div.style.color = contrastColor(hex);
        div.textContent = hex;
        div.onclick = () => { document.getElementById('hint').textContent = 'Selected: ' + hex; };
        container.appendChild(div);
      }
    }
    document.getElementById('gen').onclick = generate;
    generate();
  <\/script>

         background:#F7F8F3; font-family:sans-serif; }

  button { padding:10px 20px; margin:4px; border:none; border-radius:6px; cursor:pointer; color:#fff; font-size:1em; }

  #stopBtn { background:#F7444E; }

</style></head>
<body>
  <div class="box">
    <div id="time">00:00.0</div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
  </div>
  <script>
    let elapsedMs = 0;
    let running = false;
    let lastTick = null;
    let intervalId = null;

    function render() {
      const totalSeconds = elapsedMs / 1000;
      const mins = Math.floor(totalSeconds / 60);
      const secs = Math.floor(totalSeconds % 60);
      const tenths = Math.floor((elapsedMs % 1000) / 100);
      document.getElementById('time').textContent =
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '.' + tenths;
    }

    document.getElementById('startBtn').onclick = () => {
      if (running) return;
      running = true;
      lastTick = Date.now();
      intervalId = setInterval(() => {
        const now = Date.now();
        elapsedMs += now - lastTick;
        lastTick = now;
        render();
      }, 100);
    };
    document.getElementById('stopBtn').onclick = () => {
      running = false;
      clearInterval(intervalId);
    };
    document.getElementById('resetBtn').onclick = () => {
      running = false;
      clearInterval(intervalId);
      elapsedMs = 0;
      render();
    };
    render();
  <\/script>
</body></html>

</style></head>
<body>
  <div class="carousel" id="carousel">
    <button class="nav prev" id="prevBtn">&#8249;</button>
    <button class="nav next" id="nextBtn">&#8250;</button>
    <div class="dots" id="dots"></div>
  </div>
  <script>
    const colors = ['#F7444E', '#78BCC4', '#3ddc84', '#ffd23f'];
    const emojis = ['🏔️', '🌊', '🌲', '🌅'];
    let current = 0;
    const carousel = document.getElementById('carousel');

    const slides = colors.map((c, i) => {
      const s = document.createElement('div');
      s.className = 'slide';
      s.style.background = c;
      s.textContent = emojis[i];
      carousel.insertBefore(s, document.getElementById('dots'));
      return s;
    });

    const dots = colors.map((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => goTo(i);
      document.getElementById('dots').appendChild(d);
      return d;
    });

    function render() {
      slides.forEach((s, i) => { s.style.display = i === current ? 'flex' : 'none'; });
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }
    function goTo(i) { current = (i + colors.length) % colors.length; render(); }

    document.getElementById('prevBtn').onclick = () => goTo(current - 1);
    document.getElementById('nextBtn').onclick = () => goTo(current + 1);
    render();
    setInterval(() => goTo(current + 1), 3000);
  <\/script>
</body></html>

      { q: 'Which keyword declares a constant in JavaScript?', opts: ['var', 'let', 'const', 'static'], a: 2 },
      { q: 'What does HTML stand for?', opts: ['Hyper Text Markup Language', 'High Transfer Markup Logic', 'Home Tool Markup Language', 'Hyperlink Markdown Language'], a: 0 },
      { q: 'Which language compiles to a binary with gcc?', opts: ['Python', 'C', 'JavaScript', 'Dart'], a: 1 },

    function render() {
      if (idx >= questions.length) {
        document.getElementById('question').textContent = 'Quiz complete!';
        document.getElementById('options').innerHTML = '';
        document.getElementById('score').textContent = 'Final score: ' + score + '/' + questions.length;

  };

  let editor;
  require.config({ paths: { vs: "https://unpkg.com/monaco-editor@0.48.0/min/vs" } });
  require(["vs/editor/editor.main"], () => {
    editor = monaco.editor.create(document.getElementById("editor"), {
      value: DEFAULT_SNIPPETS.python,
      language: "python",
      theme: "vs-dark",
      automaticLayout: true,
      fontSize: 14,
      minimap: { enabled: false },
    });
    populateExamples("python"); // initial language on load

    // TIER 5: if the URL has ?id=..., load that saved snippet on open.
    const params = new URLSearchParams(window.location.search);
    const loadId = params.get("id");
    if (loadId) {
      fetch(`/load/${loadId}`)
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((snippet) => {
          languageSelect.value = snippet.language;
          const monacoLang = snippet.language === "node" ? "javascript" : snippet.language === "web" ? "html" : snippet.language;
          monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
          editor.setValue(snippet.code);
        })
        .catch(() => {
          runMetaEl.textContent = "Couldn't load that saved snippet (bad or expired id).";
        });
    }
  });

  const languageSelect = document.getElementById("language");
  const examplesSelect = document.getElementById("examples");

  function populateExamples(lang) {
    examplesSelect.innerHTML = '<option value="">Examples…</option>';
    const examples = EXAMPLES[lang] || {};
    for (const name of Object.keys(examples)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      examplesSelect.appendChild(opt);
    }
  }

  examplesSelect.addEventListener("change", () => {
    const lang = languageSelect.value;
    const snippet = EXAMPLES[lang] && EXAMPLES[lang][examplesSelect.value];
    if (snippet) editor.setValue(snippet);
  });

  languageSelect.addEventListener("change", () => {
    const lang = languageSelect.value;
    const monacoLang = lang === "node" ? "javascript" : lang === "web" ? "html" : lang; // dart/python/c map directly
    monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
    if (!editor.getValue().trim()) {
      editor.setValue(DEFAULT_SNIPPETS[lang]);
    }
    populateExamples(lang);
  });

  const runBtn = document.getElementById("runBtn");
  const saveBtn = document.getElementById("saveBtn");
  const outputEl = document.getElementById("output");
  const runMetaEl = document.getElementById("runMeta");
  const stdinEl = document.getElementById("stdinInput");

  // Draggable splitter: lets people maximize whichever panel (editor or
  // output) they're focused on, instead of a fixed 60/40 split.
  (function setupSplitter() {
    const splitter = document.getElementById("splitter");
    const outputPanel = document.getElementById("output-panel");
    const mainEl = document.querySelector("main");
    let dragging = false;

    const saved = localStorage.getItem("sandboxOutputWidthPct");
    if (saved) {
      outputPanel.style.width = saved + "%";
    }

    splitter.addEventListener("mousedown", (e) => {
      dragging = true;
      splitter.classList.add("dragging");
      document.body.style.userSelect = "none";
      e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const rect = mainEl.getBoundingClientRect();
      let pct = ((rect.right - e.clientX) / rect.width) * 100;
      pct = Math.min(80, Math.max(15, pct));
      outputPanel.style.width = pct + "%";
      if (editor) editor.layout();
    });

    window.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      splitter.classList.remove("dragging");
      document.body.style.userSelect = "";
      const pct = parseFloat(outputPanel.style.width);
      if (!isNaN(pct)) localStorage.setItem("sandboxOutputWidthPct", pct.toFixed(1));
      if (editor) editor.layout();
    });
  })();

  saveBtn.addEventListener("click", async () => {
    const name = window.prompt("Name this project:", "Untitled project");
    if (name === null) return; // user hit Cancel

    saveBtn.disabled = true;
    const originalText = saveBtn.textContent;
    saveBtn.textContent = "Saving…";
    try {
      const res = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language: languageSelect.value, code: editor.getValue(), name }),
      });
      const data = await res.json();
      if (data.id) {
        const url = `${window.location.origin}${window.location.pathname}?id=${data.id}`;
        // Update the address bar so refreshing keeps this snippet, and copy
        // the shareable link to the clipboard as a convenience.
        window.history.replaceState({}, "", `?id=${data.id}`);
        try {
          await navigator.clipboard.writeText(url);
          runMetaEl.textContent = `Saved. Link copied to clipboard: ${url}`;
        } catch (_) {
          runMetaEl.textContent = `Saved. Link: ${url}`;
        }
      } else {
        runMetaEl.textContent = "Save failed — see server logs.";
      }
    } catch (err) {
      runMetaEl.textContent = `Save failed: ${String(err)}`;
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalText;
    }
  });

  // "New" clears the editor back to a fresh default snippet for whatever
  // language is currently selected, after confirming if there's real work
  // in progress so a stray click can't silently wipe something unsaved.
  const newBtn = document.getElementById("newBtn");
  newBtn.addEventListener("click", () => {
    const current = editor.getValue().trim();
    const isDefault = Object.values(DEFAULT_SNIPPETS).some((s) => s.trim() === current);
    if (current && !isDefault) {
      const proceed = window.confirm("This will clear your current code. Save it first if you want to keep it. Continue?");
      if (!proceed) return;
    }
    editor.setValue(DEFAULT_SNIPPETS[languageSelect.value] || "");
    examplesSelect.value = "";
    window.history.replaceState({}, "", window.location.pathname);
    runMetaEl.textContent = "";
    outputEl.innerHTML = "Run something to see output here.";
  });

  // "Open" shows a picker of everything saved via the Save button, pulled
  // live from the server rather than requiring people to remember or paste
  // a raw link.
  const openBtn = document.getElementById("openBtn");
  const projectsOverlay = document.getElementById("projectsOverlay");
  const projectsList = document.getElementById("projectsList");
  const projectsClose = document.getElementById("projectsClose");
  const projectsClearAll = document.getElementById("projectsClearAll");

  async function loadProjectsList() {
    projectsList.innerHTML = "Loading…";
    try {
      const res = await fetch("/projects");
      const projects = await res.json();
      if (!Array.isArray(projects) || projects.length === 0) {
        projectsList.innerHTML = '<div class="project-empty">No saved projects yet. Use Save to create one.</div>';
        return;
      }
      projectsList.innerHTML = "";
      for (const p of projects) {
        const row = document.createElement("div");
        row.className = "project-row";
        const when = p.savedAt ? new Date(p.savedAt).toLocaleString() : "";
        row.innerHTML = `<span class="row-main"><span>${escapeHtml(p.name || "Previous run")}</span><span class="meta">${escapeHtml(p.language)} · ${escapeHtml(when)}</span></span><button class="delete-btn" title="Delete this project">🗑</button>`;
        row.addEventListener("click", async () => {
          try {
            const r = await fetch(`/load/${p.id}`);
            if (!r.ok) throw new Error("not found");
            const snippet = await r.json();
            languageSelect.value = snippet.language;
            const monacoLang = snippet.language === "node" ? "javascript" : snippet.language === "web" ? "html" : snippet.language;
            monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
            editor.setValue(snippet.code);
            populateExamples(snippet.language);
            window.history.replaceState({}, "", `?id=${p.id}`);
            projectsOverlay.classList.remove("show");
          } catch (_) {
            runMetaEl.textContent = "Couldn't load that project.";
          }
        });
        row.querySelector(".delete-btn").addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!window.confirm(`Delete "${p.name || "Previous run"}"? This can't be undone.`)) return;
          try {
            await fetch(`/projects/${p.id}`, { method: "DELETE" });
            loadProjectsList();
          } catch (_) {
            runMetaEl.textContent = "Couldn't delete that project.";
          }
        });
        projectsList.appendChild(row);
      }
    } catch (_) {
      projectsList.innerHTML = '<div class="project-empty">Couldn\'t reach the server to list projects.</div>';
    }
  }

  openBtn.addEventListener("click", () => {
    projectsOverlay.classList.add("show");
    loadProjectsList();
  });
  projectsClose.addEventListener("click", () => projectsOverlay.classList.remove("show"));
  projectsOverlay.addEventListener("click", (e) => {
    if (e.target === projectsOverlay) projectsOverlay.classList.remove("show");
  });
  projectsClearAll.addEventListener("click", async () => {
    if (!window.confirm("Delete ALL saved projects? This can't be undone.")) return;
    try {
      await fetch("/projects", { method: "DELETE" });
      loadProjectsList();
    } catch (_) {
      runMetaEl.textContent = "Couldn't clear projects.";
    }
  });

  // "Import" loads a local code file straight into the editor, client-side
  // only -- no server round trip, no project created. The file's extension
  // picks the language automatically where it maps cleanly.
  //
  // Selecting MULTIPLE files is a lightweight stand-in for "import a
  // folder": each file is saved as its own project (via the existing
  // /save endpoint) rather than merged into one multi-file project, since
  // the editor and storage are both single-file. Open the picker
  // afterwards to switch between the imported files.
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  const EXT_TO_LANG = {
    py: "python", js: "node", dart: "dart", go: "go", c: "c", cpp: "cpp", ts: "typescript", html: "web",
  };
  importBtn.addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const files = importFile.files ? Array.from(importFile.files) : [];
    if (files.length === 0) return;

    if (files.length === 1) {
      const file = files[0];
      const text = await file.text();
      const ext = file.name.split(".").pop().toLowerCase();
      const lang = EXT_TO_LANG[ext];
      if (lang) {
        languageSelect.value = lang;
        const monacoLang = lang === "node" ? "javascript" : lang === "web" ? "html" : lang;
        monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
        populateExamples(lang);
      }
      editor.setValue(text);
      examplesSelect.value = "";
      window.history.replaceState({}, "", window.location.pathname);
      runMetaEl.textContent = lang
        ? `Imported ${file.name}`
        : `Imported ${file.name} (unrecognized extension — kept current language)`;
      importFile.value = "";
      return;
    }

    // Multiple files: save each as its own project instead of guessing
    // which one should land in the editor.
    runMetaEl.textContent = `Importing ${files.length} files…`;
    let imported = 0;
    let skipped = 0;
    for (const file of files) {
      const ext = file.name.split(".").pop().toLowerCase();
      const lang = EXT_TO_LANG[ext];
      if (!lang) {
        skipped++;
        continue;
      }
      try {
        const text = await file.text();
        const res = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ language: lang, code: text, name: file.name }),
        });
        if (res.ok) imported++;
        else skipped++;
      } catch (_) {
        skipped++;
      }
    }
    runMetaEl.textContent = skipped > 0
      ? `Imported ${imported} file(s) as projects, skipped ${skipped} (unrecognized extension or save failed). Open them via 📂 Open.`
      : `Imported ${imported} file(s) as projects. Open them via 📂 Open.`;
    importFile.value = "";
  });

  runBtn.addEventListener("click", async () => {
    const code = editor.getValue();
    const language = languageSelect.value;
    const stdin = stdinEl.value;

    runBtn.disabled = true;
    runBtn.textContent = "Running…";
    outputEl.innerHTML = "";
    runMetaEl.textContent = "";

    // "Web" is a client-side-only language: it's rendered directly in the
    // browser, not executed in a Docker container, so there's no sandbox
    // to run it in and nothing to send to the server. The iframe still
    // isolates it from the rest of this page the same way visual examples
    // from other languages are rendered.
    if (language === "web") {
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts");
      iframe.style.width = "100%";
      iframe.style.height = "400px";
      iframe.style.border = "1px solid rgba(0,44,62,0.15)";
      iframe.style.borderRadius = "6px";
      iframe.style.background = "#fff";
      iframe.srcdoc = code;
      outputEl.appendChild(iframe);
      runMetaEl.textContent = "Rendered directly in your browser (no container used)";
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
      return;
    }

    try {
      const res = await fetch("/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language, code, stdin }),
      });
      const data = await res.json();

      if (data.error) {
        outputEl.innerHTML = `<span class="stderr">${escapeHtml(data.error)}</span>`;
      } else {
        // If the program's own output IS a complete HTML document, render
        // it live instead of showing it as escaped text -- this is how
        // "visual" examples (a moving car, fireworks, a login page) work:
        // the sandboxed code prints real HTML/CSS/JS, and the browser
        // renders it here, safely isolated in a sandboxed iframe (no
        // same-origin access to this page, so it can't read anything of
        // yours even if the printed code were malicious).
        const trimmedOutput = (data.output || "").trim();
        const looksLikeHtmlDoc = /^<!DOCTYPE html>|^<html[\s>]/i.test(trimmedOutput);

        if (looksLikeHtmlDoc && !data.errorOutput && !data.timedOut) {
          outputEl.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.setAttribute("sandbox", "allow-scripts");
          iframe.style.width = "100%";
          iframe.style.height = "400px";
          iframe.style.border = "1px solid rgba(0,44,62,0.15)";
          iframe.style.borderRadius = "6px";
          iframe.style.background = "#fff";
          iframe.srcdoc = data.output;
          outputEl.appendChild(iframe);
        } else {
          let html = "";
          if (data.output) html += escapeHtml(data.output);
          if (data.errorOutput) html += `<span class="stderr">${escapeHtml(data.errorOutput)}</span>`;
          if (data.timedOut) html += `\n<span class="stderr">⚠ Run exceeded the time limit and was stopped.</span>`;
          if (!html) html = "(no output)";
          outputEl.innerHTML = html;
        }
        if (data.note) {
          const noteDiv = document.createElement("div");
          noteDiv.className = "note";
          noteDiv.textContent = data.note;
          outputEl.appendChild(noteDiv);
        }

        // TIER 4: observability — surface what actually happened, not just output text.
        const metaParts = [];
        if (typeof data.durationMs === "number") metaParts.push(`${data.durationMs}ms`);
        if (data.exitCode !== null && data.exitCode !== undefined) metaParts.push(`exit code ${data.exitCode}`);
        if (data.profile) metaParts.push(`${data.profile} profile`);
        if (data.viaPool) metaParts.push("warm pool");
        runMetaEl.textContent = metaParts.join(" · ");
      }
    } catch (err) {
      outputEl.innerHTML = `<span class="stderr">Failed to reach the sandbox server: ${escapeHtml(String(err))}</span>`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
    }
  });

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
