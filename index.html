<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sandbox IDE</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --text: #d4d4d4;
    --accent: #0e7c86;
    --border: #333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .controls { display: flex; align-items: center; gap: 10px; }
  select, button {
    background: #2d2d2d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.run {
    background: var(--accent);
    border: none;
    font-weight: 600;
  }
  button.run:disabled { opacity: 0.5; cursor: default; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editor { flex: 1; }
  #output-panel {
    width: 40%;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  #output-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin: 0;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  #output {
    flex: 1;
    overflow: auto;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .stderr { color: #f14c4c; }
  .note { color: #888; font-size: 12px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>Sandbox IDE</h1>
  <div class="controls">
    <select id="language">
      <option value="python">Python</option>
      <option value="node">Node.js</option>
    </select>
    <button class="run" id="runBtn">▶ Run</button>
  </div>
</header>

<main>
  <div id="editor"></div>
  <div id="output-panel">
    <h2>Output</h2>
    <div id="output">Run something to see output here.</div>
  </div>
</main>

<script src="https://unpkg.com/monaco-editor@0.48.0/min/vs/loader.js"></script>
<script>
  const DEFAULT_SNIPPETS = {
    python: `print("hello from the sandbox")`,
    node: `console.log("hello from the sandbox");`,
  };

  let editor;
  require.config({ paths: { vs: "https://unpkg.com/monaco-editor@0.48.0/min/vs" } });
  require(["vs/editor/editor.main"], () => {
    editor = monaco.editor.create(document.getElementById("editor"), {
      value: DEFAULT_SNIPPETS.python,
      language: "python",
      theme: "vs-dark",
      automaticLayout: true,
      fontSize: 14,
      minimap: { enabled: false },
    });
  });

  const languageSelect = document.getElementById("language");
  languageSelect.addEventListener("change", () => {
    const lang = languageSelect.value;
    monaco.editor.setModelLanguage(editor.getModel(), lang === "node" ? "javascript" : "python");
    if (!editor.getValue().trim()) {
      editor.setValue(DEFAULT_SNIPPETS[lang]);
    }
  });

  const runBtn = document.getElementById("runBtn");
  const outputEl = document.getElementById("output");

  runBtn.addEventListener("click", async () => {
    const code = editor.getValue();
    const language = languageSelect.value;

    runBtn.disabled = true;
    runBtn.textContent = "Running…";
    outputEl.innerHTML = "";

    try {
      const res = await fetch("/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language, code }),
      });
      const data = await res.json();

      if (data.error) {
        outputEl.innerHTML = `<span class="stderr">${escapeHtml(data.error)}</span>`;
      } else {
        let html = "";
        if (data.output) html += escapeHtml(data.output);
        if (data.errorOutput) html += `<span class="stderr">${escapeHtml(data.errorOutput)}</span>`;
        if (data.timedOut) html += `\n<span class="stderr">⚠ Run exceeded the time limit and was stopped.</span>`;
        if (!html) html = "(no output)";
        if (data.note) html += `<div class="note">${escapeHtml(data.note)}</div>`;
        outputEl.innerHTML = html;
      }
    } catch (err) {
      outputEl.innerHTML = `<span class="stderr">Failed to reach the sandbox server: ${escapeHtml(String(err))}</span>`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
    }
  });

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
